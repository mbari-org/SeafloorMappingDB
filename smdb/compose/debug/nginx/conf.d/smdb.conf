# SMDB app (Django dev server on the django service). Use this because Docker Desktop on
# macOS sometimes returns empty HTTP replies when publishing the django port to the host;
# routing through nginx avoids that broken path.
server {
    listen 80;
    server_name localhost;

    # Optional: browse mounted SeafloorMapping share (same path as compose volume target)
    location /SeafloorMapping/ {
        alias /usr/share/nginx/html/SeafloorMapping/;
        autoindex on;
    }

    location / {
        proxy_pass http://django:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
